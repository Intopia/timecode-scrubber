<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timecode Scrubber - Intopia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!--
  ASSETS NOT HOTLINKED — placeholders below, please point these at self-hosted files:
  - .intopia-logo img src="assets/intopia-logo.png"
  - favicon href="assets/favicon.png"
  - Space Grotesk / IBM Plex Sans / IBM Plex Mono are NOT imported from Google Fonts.
    Font-family declarations below list them first with system-font fallbacks, so the
    page will currently render in the fallback fonts until these are self-hosted
    (or the Google Fonts <link>/@import is added back in) and enabled.
-->
<link rel="shortcut icon" href="https://intopia.digital/wp-content/uploads/2017/06/cropped-Intopia_FINAL_icon-32x32.png" sizes="32x32">
<style>
  :root {
    --ink: #16233d;
    --ink-soft: #4a5875;
    --paper: #efefef;
    --panel: #ffffff;
    --line: #d9d2be;
    --border-strong: #dddddd;
    --red: #a5322a;
    --red-bg: #fbeae7;
    --green: #29614a;
    --green-bg: #e9f2ec;
    --amber: #93641a;
    --amber-bg: #faf1dc;
    --neutral: #5b6472;
    --neutral-bg: #f4f3ef;
    --info: #29506b;
    --info-bg: #e6eef3;
    --focus: #1b4fbf;
    --brand: #c03c0c;
    --font-brand: 'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, Frutiger, 'Frutiger Linotype', Univers, Calibri, 'Gill Sans', 'Gill Sans MT', 'Myriad Pro', Myriad, 'DejaVu Sans Condensed', 'Liberation Sans', 'Nimbus Sans L', Tahoma, Geneva, sans-serif;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --radius: 4px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    padding: 48px 20px;
    display: flex;
    justify-content: center;
  }
  .page {
    max-width: 560px;
    width: 100%;
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 28px;
  }
  .intopia-logo {
    width: 180px;
    height: auto;
  }
  .brand-text h1 {
    font-family: var(--font-brand);
    color: var(--brand);
    font-size: 2.4rem;
    font-weight: 600;
    margin: 0;
  }
  .privacy-note {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin: 10px 0 0;
  }
  .card {
    background: var(--panel);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 32px;
  }
  .card + .card,
  #resultArea,
  #errorArea {
    margin-top: 20px;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--ink);
  }
  input[type="file"] {
    display: block;
    width: 100%;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    margin-bottom: 20px;
    font-family: var(--font-body);
    font-size: 0.95rem;
    color: var(--ink);
  }
  button {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 1.1rem;
    cursor: pointer;
    border-radius: var(--radius);
    padding: 12px 22px;
  }
  .btn-primary {
    background: var(--brand);
    color: #ffffff;
    border: 2px solid var(--brand);
    width: 100%;
  }
  .btn-primary:hover {
    opacity: 0.9;
  }
  .btn-primary:disabled {
    background: var(--neutral);
    border-color: var(--neutral);
    cursor: not-allowed;
    opacity: 1;
  }
  :focus { outline: 3px solid var(--focus); outline-offset: 2px; }
  :focus:not(:focus-visible) { outline: none; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  #resultArea {
    padding: 18px 20px;
    border-radius: var(--radius);
    background: var(--green-bg);
    border: 1px solid var(--green);
    display: none;
  }
  #resultArea.visible { display: block; }
  #resultArea h2 {
    font-family: var(--font-display);
    color: var(--ink);
    font-size: 1.05rem;
    margin: 0 0 12px;
  }
  #resultArea .filename {
    font-family: var(--font-mono);
    color: var(--ink);
    font-weight: 600;
    margin-bottom: 14px;
    word-break: break-all;
  }
  #downloadBtn {
    background: var(--green);
    color: #ffffff;
    border: 2px solid var(--green);
  }
  #downloadBtn:hover {
    opacity: 0.9;
  }
  .meta {
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin-top: 10px;
  }
  #errorArea {
    padding: 16px 20px;
    border-radius: var(--radius);
    background: var(--red-bg);
    border: 1px solid var(--red);
    color: var(--red);
    display: none;
    font-size: 0.92rem;
  }
  #errorArea.visible { display: block; }
</style>
</head>
<body>

<div class="page">

  <div class="brand">
    <img src="https://intopia.digital/wp-content/themes/intopia-refresh/assets/images/intopia.png" alt="Intopia logo" class="intopia-logo">
    <div class="brand-text">
      <h1>Timecode scrubber</h1>
      <p class="privacy-note">Nothing you upload leaves your browser — the conversion happens entirely on your device.</p>
    </div>
  </div>

  <div class="card">
    <form id="convertForm">
      <label for="captionFile">Select a caption file</label>
      <input type="file" id="captionFile" name="captionFile" accept=".srt,.vtt,text/vtt,application/x-subrip" required>
      <button type="submit" id="submitBtn" class="btn-primary">Convert to document transcript</button>
    </form>
  </div>

  <div id="errorArea"></div>

  <div id="resultArea">
    <h2>Your transcript is ready</h2>
    <div class="filename" id="resultFilename"></div>
    <button id="downloadBtn" type="button" class="btn-primary">Download</button>
    <div class="meta" id="resultMeta"></div>
  </div>

</div>

<script>
(function () {
  const form = document.getElementById('convertForm');
  const fileInput = document.getElementById('captionFile');
  const submitBtn = document.getElementById('submitBtn');
  const resultArea = document.getElementById('resultArea');
  const resultFilename = document.getElementById('resultFilename');
  const resultMeta = document.getElementById('resultMeta');
  const downloadBtn = document.getElementById('downloadBtn');
  const errorArea = document.getElementById('errorArea');

  let currentBlobUrl = null;
  let currentFilename = null;

  function showError(msg) {
    errorArea.textContent = msg;
    errorArea.classList.add('visible');
    resultArea.classList.remove('visible');
  }

  function clearError() {
    errorArea.textContent = '';
    errorArea.classList.remove('visible');
  }

  // Parse SRT or VTT text into an array of cue-text strings.
  // Each cue's (possibly multi-line) text is collapsed into a single line.
  // Timecode lines, cue index numbers, and VTT headers/NOTE blocks are discarded.
  function parseCaptions(rawText) {
    const lines = rawText.replace(/\r/g, '').split('\n');
    const cues = [];
    let current = [];
    let inCue = false;

    function flush() {
      if (current.length) {
        const joined = current.join(' ').replace(/\s+/g, ' ').trim();
        if (joined) cues.push(joined);
        current = [];
      }
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      if (line.includes('-->')) {
        flush();
        inCue = true;
        continue;
      }

      if (inCue) {
        if (line.trim() === '') {
          flush();
          inCue = false;
        } else {
          const cleaned = line.replace(/<[^>]+>/g, '').trim();
          if (cleaned) current.push(cleaned);
        }
      }
    }
    flush();

    return cues;
  }

  function escapeXml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  }

  // Build a minimal, valid .docx (OOXML) file from an array of paragraph strings.
  async function buildDocx(paragraphs) {
    const zip = new JSZip();

    const contentTypes =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>
<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>
</Types>`;

    const rels =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>
<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>
</Relationships>`;

    const coreProps =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:title>Transcript</dc:title>
<dc:creator>Timecode Scrubber</dc:creator>
</cp:coreProperties>`;

    const appProps =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties">
<Application>Timecode Scrubber</Application>
</Properties>`;

    const bodyParagraphs = paragraphs.map(p =>
      `<w:p><w:r><w:t xml:space="preserve">${escapeXml(p)}</w:t></w:r></w:p>`
    ).join('');

    const documentXml =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>
${bodyParagraphs}
<w:sectPr>
<w:pgSz w:w="12240" w:h="15840"/>
<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/>
</w:sectPr>
</w:body>
</w:document>`;

    zip.file('[Content_Types].xml', contentTypes);
    zip.folder('_rels').file('.rels', rels);
    zip.folder('docProps').file('core.xml', coreProps);
    zip.file('docProps/app.xml', appProps);
    zip.folder('word').file('document.xml', documentXml);

    return await zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  }

  function deriveFilename(originalName) {
    const withoutExt = originalName.replace(/\.(srt|vtt)$/i, '');
    return (withoutExt || 'transcript') + '.docx';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearError();
    resultArea.classList.remove('visible');

    const file = fileInput.files[0];
    if (!file) {
      showError('Please select an SRT or VTT file first.');
      return;
    }

    const nameLower = file.name.toLowerCase();
    if (!nameLower.endsWith('.srt') && !nameLower.endsWith('.vtt')) {
      showError('Please select a file with a .srt or .vtt extension.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Converting…';

    try {
      const text = await file.text();
      const cues = parseCaptions(text);

      if (cues.length === 0) {
        showError('No caption text could be found in this file. Please check the file format.');
        return;
      }

      const blob = await buildDocx(cues);
      const filename = deriveFilename(file.name);

      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
      }
      currentBlobUrl = URL.createObjectURL(blob);
      currentFilename = filename;

      resultFilename.textContent = filename;
      resultMeta.textContent = cues.length + ' line' + (cues.length === 1 ? '' : 's') + ' of transcript text';
      resultArea.classList.add('visible');
    } catch (err) {
      console.error(err);
      showError('Something went wrong while converting the file: ' + err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Convert to document transcript';
    }
  });

  downloadBtn.addEventListener('click', function () {
    if (!currentBlobUrl || !currentFilename) return;
    const a = document.createElement('a');
    a.href = currentBlobUrl;
    a.download = currentFilename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
})();
</script>

</body>
</html>
